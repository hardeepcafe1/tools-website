  <main class="tool-shell">
    <div class="tool-head">
      <div class="tool-icon tint-developer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 4H7a2 2 0 0 0-2 2v3.5a2 2 0 0 1-2 2 2 2 0 0 1 2 2V17a2 2 0 0 0 2 2h1.5"/><path d="M15.5 4H17a2 2 0 0 1 2 2v3.5a2 2 0 0 0 2 2 2 2 0 0 0-2 2V17a2 2 0 0 1-2 2h-1.5"/></svg>
      </div>
      <h1>JSON Formatter &amp; Validator</h1>
      <p>Paste your JSON — prettify it, minify it, or find exactly what's broken. Nothing is sent anywhere.</p>
    </div>

    <div class="tool-panel">
      <label for="jsonInput" style="font-size:12px;font-weight:650;letter-spacing:.03em;color:var(--text-2);display:block;margin-bottom:7px">Your JSON</label>
      <textarea id="jsonInput" class="tool-textarea" style="min-height:170px;font-family:var(--mono);font-size:13px" placeholder='{"name":"Toolbox","tools":17,"free":true}' spellcheck="false" autofocus></textarea>

      <div class="tool-actions" style="margin-top:12px">
        <button class="btn btn-primary" id="prettifyBtn">Prettify</button>
        <button class="btn btn-ghost" id="minifyBtn">Minify</button>
        <button class="btn btn-ghost" id="sampleBtn">Load sample</button>
        <button class="btn btn-ghost" id="copyBtn">Copy output</button>
        <button class="btn btn-ghost" id="clearBtn">Clear</button>
      </div>

      <div class="ok-box" id="okBox" role="status"></div>
      <div class="error-box" id="errorBox" role="alert" style="margin-top:12px"></div>

      <label style="font-size:12px;font-weight:650;letter-spacing:.03em;color:var(--text-2);display:block;margin:16px 0 7px">Formatted output</label>
      <div class="pre-dark"><code class="json-code" id="jsonOutput"></code></div>
    </div>
  </main>

  <a class="harmno-badge" href="https://github.com/harmno" target="_blank" rel="noopener" aria-label="Harmno on GitHub"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.111.82-.261.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>Harmno</a>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="tool-footer-mini">
    <a href="../../../index.html">← Back to all tools</a> &nbsp;·&nbsp; Toolbox by <a href="https://github.com/harmno" target="_blank" rel="noopener">Harmno</a>
  </footer>

  <script>
    const input     = document.getElementById('jsonInput');
    const output    = document.getElementById('jsonOutput');
    const okBox     = document.getElementById('okBox');
    const errorBox  = document.getElementById('errorBox');
    const toast     = document.getElementById('toast');

    const SAMPLE = {
      name: 'Toolbox',
      tagline: 'Every simple tool you need, in one place',
      free: true,
      tools: ['Word Counter', 'JSON Formatter', 'Case Converter'],
      stats: { tools: 17, signups: 0, uptime: '100%' },
      maintainer: null,
    };

    let lastValid = '';
    let toastTimer;

    const escapeHTML = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function highlight(json) {
      return escapeHTML(json).replace(
        /("(\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\btrue\b|\bfalse\b|\bnull\b|-?\d+(\.\d+)?([eE][+-]?\d+)?)/g,
        (match) => {
          let cls = 'json-number';
          if (/^"/.test(match)) cls = /:$/.test(match.trim()) ? 'json-key' : 'json-string';
          else if (/^(true|false|null)$/.test(match)) cls = 'json-bool';
          return `<span class="${cls}">${match}</span>`;
        }
      );
    }

    function locateError(src, errMsg) {
      const m = /position (\d+)/i.exec(errMsg);
      if (!m) return null;
      const pos = parseInt(m[1], 10);
      const upTo = src.slice(0, pos);
      const line = upTo.split('\n').length;
      const col = pos - upTo.lastIndexOf('\n');
      return { line, col };
    }

    function showOk(msg) {
      okBox.textContent = msg;
      okBox.classList.add('show');
      errorBox.classList.remove('show');
    }
    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('show');
      okBox.classList.remove('show');
    }
    function clearBoxes() {
      okBox.classList.remove('show');
      errorBox.classList.remove('show');
    }
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function process(mode) {
      const src = input.value.trim();
      clearBoxes();
      if (!src) {
        output.innerHTML = '';
        lastValid = '';
        showError('Paste some JSON first.');
        return;
      }
      try {
        const parsed = JSON.parse(src);
        const formatted = mode === 'minify' ? JSON.stringify(parsed) : JSON.stringify(parsed, null, 2);
        lastValid = formatted;
        output.innerHTML = highlight(formatted);
        showOk(mode === 'minify'
          ? `Valid JSON — minified to ${formatted.length.toLocaleString()} characters.`
          : 'Valid JSON — formatted successfully.');
      } catch (err) {
        lastValid = '';
        const pos = locateError(src, err.message || '');
        const where = pos ? ` (line ${pos.line}, column ${pos.col})` : '';
        showError(`Invalid JSON: ${err.message}${where}`);
      }
    }

    document.getElementById('prettifyBtn').addEventListener('click', () => process('pretty'));
    document.getElementById('minifyBtn').addEventListener('click', () => process('minify'));
    document.getElementById('sampleBtn').addEventListener('click', () => {
      input.value = JSON.stringify(SAMPLE, null, 2);
      process('pretty');
    });
    document.getElementById('clearBtn').addEventListener('click', () => {
      input.value = '';
      output.innerHTML = '';
      lastValid = '';
      clearBoxes();
      input.focus();
    });
    document.getElementById('copyBtn').addEventListener('click', async () => {
      const text = lastValid || output.textContent;
      if (!text) { showToast('Nothing to copy yet'); return; }
      try { await navigator.clipboard.writeText(text); showToast('Copied to clipboard'); }
      catch { showToast('Clipboard blocked — select the text manually'); }
    });

    input.addEventListener('input', clearBoxes);
  </script>
  <script src="../../../js/vault.js"></script>
</body>
</html>
