<head>

  <title>Percentage Calculator — Toolbox</title>
  <meta name="description" content="Three percentage calculators in one: what is X% of Y, what percent is X of Y, and percentage change — instant results." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<!-- toolbox-icon: percent -->
</head>
<body class="tool-page">

  <header class="tool-nav">
    <div class="tool-nav-inner">
      <a class="back-link" href="../../../index.html">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        All tools
      </a>
      <a class="brand" href="../../../index.html" aria-label="Toolbox home">
        <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <defs><linearGradient id="brandGradSm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
          <rect width="32" height="32" rx="8" fill="url(#brandGradSm)"/>
          <rect x="8.5" y="8.5" width="6.5" height="6.5" rx="1.6" fill="#fff"/>
          <rect x="17" y="8.5" width="6.5" height="6.5" rx="1.6" fill="#fff" opacity=".75"/>
          <rect x="8.5" y="17" width="6.5" height="6.5" rx="1.6" fill="#fff" opacity=".75"/>
          <rect x="17" y="17" width="6.5" height="6.5" rx="1.6" fill="#fff" opacity=".5"/>
        </svg>
        <span class="brand-name" style="font-size:17px">Toolbox</span>
      </a>
    </div>
  </header>

  <main class="tool-shell">
    <div class="tool-head">
      <div class="tool-icon tint-calculators">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="7.4" cy="7.4" r="2.4"/><circle cx="16.6" cy="16.6" r="2.4"/></svg>
      </div>
      <h1>Percentage Calculator</h1>
      <p>Three of the most-asked percentage questions — answered live as you type.</p>
    </div>

    <div class="tool-panel" style="display:grid;gap:14px">

      <!-- 1: What is X% of Y -->
      <section class="result-row" style="align-items:center">
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px">What is — % of —?</div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <input type="number" class="text-input" style="width:110px" id="a1Pct" inputmode="decimal" placeholder="20" value="20" aria-label="Percent" />
            <span style="color:var(--text-2);font-weight:600">% of</span>
            <input type="number" class="text-input" style="width:150px" id="a1Of" inputmode="decimal" placeholder="250" value="250" aria-label="Of value" />
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:11px;color:var(--text-3);margin-bottom:2px">Answer</div>
          <strong class="big-result" id="a1Result" style="font-size:1.9rem">50</strong>
        </div>
      </section>

      <!-- 2: X is what % of Y -->
      <section class="result-row" style="align-items:center">
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px">— is what percent of —?</div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <input type="number" class="text-input" style="width:110px" id="a2Part" inputmode="decimal" placeholder="45" value="45" aria-label="Part value" />
            <span style="color:var(--text-2);font-weight:600">is what % of</span>
            <input type="number" class="text-input" style="width:150px" id="a2Whole" inputmode="decimal" placeholder="180" value="180" aria-label="Whole value" />
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:11px;color:var(--text-3);margin-bottom:2px">Answer</div>
          <strong class="big-result" id="a2Result" style="font-size:1.9rem">25%</strong>
        </div>
      </section>

      <!-- 3: Percentage change -->
      <section class="result-row" style="align-items:center">
        <div style="flex:1;min-width:0">
          <div style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px">Percentage change from — to —</div>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <input type="number" class="text-input" style="width:130px" id="a3From" inputmode="decimal" placeholder="80" value="80" aria-label="From value" />
            <span style="color:var(--text-2);font-weight:600">→</span>
            <input type="number" class="text-input" style="width:130px" id="a3To" inputmode="decimal" placeholder="120" value="120" aria-label="To value" />
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-size:11px;color:var(--text-3);margin-bottom:2px">Change</div>
          <strong class="big-result" id="a3Result" style="font-size:1.9rem">+50%</strong>
        </div>
      </section>

    </div>
  </main>

  <a class="harmno-badge" href="https://github.com/harmno" target="_blank" rel="noopener" aria-label="Harmno on GitHub"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.111.82-.261.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>Harmno</a>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="tool-footer-mini">
    <a href="../../../index.html">← Back to all tools</a> &nbsp;·&nbsp; Toolbox by <a href="https://github.com/harmno" target="_blank" rel="noopener">Harmno</a>
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const num = (id) => {
      const v = parseFloat($(id).value);
      return Number.isFinite(v) ? v : null;
    };
    const fmt = (n) => {
      if (!Number.isFinite(n)) return '—';
      const abs = Math.abs(n);
      const opts = (abs >= 1000 || (abs !== 0 && abs < 0.01))
        ? { maximumSignificantDigits: 6 }
        : { maximumFractionDigits: 6 };
      return n.toLocaleString('en-US', opts);
    };

    function calc1() {
      const pct = num('a1Pct'), of = num('a1Of');
      $('a1Result').textContent = (pct === null || of === null) ? '—' : fmt((pct / 100) * of);
    }
    function calc2() {
      const part = num('a2Part'), whole = num('a2Whole');
      $('a2Result').textContent = (part === null || whole === null || whole === 0) ? '—' : fmt((part / whole) * 100) + '%';
    }
    function calc3() {
      const from = num('a3From'), to = num('a3To');
      const el = $('a3Result');
      if (from === null || to === null || from === 0) { el.textContent = '—'; el.style.color = ''; return; }
      const change = ((to - from) / Math.abs(from)) * 100;
      el.textContent = (change >= 0 ? '+' : '') + fmt(change) + '%';
      el.style.color = change > 0 ? 'var(--green)' : change < 0 ? '#dc2626' : '';
    }

    [['a1Pct', calc1], ['a1Of', calc1], ['a2Part', calc2], ['a2Whole', calc2], ['a3From', calc3], ['a3To', calc3]]
      .forEach(([id, fn]) => $(id).addEventListener('input', fn));

    calc1(); calc2(); calc3();
  </script>
  <script src="../../../js/vault.js"></script>
</body>
</html>
