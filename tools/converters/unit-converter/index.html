      </div>
      <h1>Unit Converter</h1>
      <p>Length, weight, temperature, area, volume, speed and digital data — every conversion, instantly.</p>

          <input type="number" id="valueInput" class="text-input" value="1" step="any" inputmode="decimal" autofocus />
        </div>
        <div class="field-group">
          <label for="fromUnit">From</label>
          <select id="fromUnit" class="select-input"></select>
        </div>
        <button class="btn btn-ghost swap-icon-btn" id="swapBtn" style="height:46px;padding:0 14px;justify-content:center" aria-label="Swap units" title="Swap units">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>

  <script>
    const CATEGORIES = {
      length:      { label: 'Length',      units: [['mm','Millimeter (mm)',0.001],['cm','Centimeter (cm)',0.01],['m','Meter (m)',1],['km','Kilometer (km)',1000],['in','Inch (in)',0.0254],['ft','Foot (ft)',0.3048],['yd','Yard (yd)',0.9144],['mi','Mile (mi)',1609.344]] },
      weight:      { label: 'Weight',      units: [['mg','Milligram (mg)',0.000001],['g','Gram (g)',0.001],['kg','Kilogram (kg)',1],['t','Tonne (t)',1000],['oz','Ounce (oz)',0.028349523125],['lb','Pound (lb)',0.45359237]] },
      temperature: { label: 'Temperature', units: [['c','Celsius (°C)'],['f','Fahrenheit (°F)'],['k','Kelvin (K)']] },
      area:        { label: 'Area',        units: [['mm2','mm²',1e-6],['cm2','cm²',1e-4],['m2','m²',1],['ha','Hectare',1e4],['km2','km²',1e6],['acre','Acre',4046.8564224],['ft2','ft²',0.09290304],['mi2','mi² (sq mile)',2589988.110336]] },
      volume:      { label: 'Volume',      units: [['ml','Milliliter (ml)',0.001],['l','Liter (l)',1],['m3','Cubic meter (m³)',1000],['tsp','Teaspoon (US)',0.00492892],['tbsp','Tablespoon (US)',0.0147868],['cup','Cup (US)',0.24],['floz','Fl oz (US)',0.0295735],['gal','Gallon (US)',3.785411784],['galuk','Gallon (UK)',4.54609]] },
      speed:       { label: 'Speed',       units: [['mps','Meters / sec',1],['kmh','km / hour',1/3.6],['mph','Miles / hour',0.44704],['fps','Feet / sec',0.3048],['knot','Knot',0.514444]] },
      data:        { label: 'Data',        units: [['bit','Bit',0.125],['b','Byte',1],['kb','Kilobyte (KB)',1024],['mb','Megabyte (MB)',1048576],['gb','Gigabyte (GB)',1073741824],['tb','Terabyte (TB)',1099511627776],['pb','Petabyte (PB)',1125899906842624]] },
    };

    const state = { category: 'length', from: 'm', to: 'cm' };

    const categoryRow = document.getElementById('categoryRow');
    const valueInput  = document.getElementById('valueInput');
    const fromUnit    = document.getElementById('fromUnit');
    const toUnit      = document.getElementById('toUnit');
    const resultValue = document.getElementById('resultValue');
    const resultUnit  = document.getElementById('resultUnit');
    const formulaNote = document.getElementById('formulaNote');

    /* Temperature is special — multiplicative factors can't express it */
    const toCelsius   = { c: (v) => v, f: (v) => (v - 32) * 5 / 9, k: (v) => v - 273.15 };
    const fromCelsius = { c: (v) => v, f: (v) => v * 9 / 5 + 32, k: (v) => v + 273.15 };

    function convert(value, from, to, category) {
      if (category === 'temperature') {
        return fromCelsius[to](toCelsius[from](value));
      }
      const units = Object.fromEntries(CATEGORIES[category].units.map(([id, , factor]) => [id, factor]));
      return (value * units[from]) / units[to];
    }

    function fmt(n) {
      if (!Number.isFinite(n)) return '—';
      if (n !== 0 && (Math.abs(n) >= 1e13 || Math.abs(n) < 1e-7)) return n.toExponential(5);
      return Number(n.toPrecision(10)).toLocaleString('en-US', { maximumFractionDigits: 6 });
    }

    /* Sensible defaults per category */
    const DEFAULTS = {
      length: ['m', 'cm'], weight: ['kg', 'g'], temperature: ['c', 'f'],
      area: ['m2', 'ft2'], volume: ['l', 'ml'], speed: ['kmh', 'mph'], data: ['mb', 'kb'],
    };

    function fillSelects() {
      const units = CATEGORIES[state.category].units;
      const options = units.map(([id, label]) => `<option value="${id}">${label}</option>`).join('');
      fromUnit.innerHTML = options;
      toUnit.innerHTML = options;
      const [wantedFrom, wantedTo] = DEFAULTS[state.category] || [units[0][0], units[1][0]];
      fromUnit.value = wantedFrom;
      toUnit.value = wantedTo;
      state.from = fromUnit.value;
      state.to = toUnit.value;
    }

    function renderCategories() {
      categoryRow.innerHTML = Object.entries(CATEGORIES).map(([id, cfg]) =>
        `<button class="opt-chip" data-cat="${id}" aria-pressed="${id === state.category}">${cfg.label}</button>`
      ).join('');
    }

    function compute() {
      const value = parseFloat(valueInput.value);
      if (!Number.isFinite(value)) {
        resultValue.textContent = '—';
        resultUnit.textContent = '';
        formulaNote.textContent = '';
        return;
      }
      state.from = fromUnit.value;
      state.to = toUnit.value;
      const converted = convert(value, state.from, state.to, state.category);
      resultValue.textContent = fmt(converted);
      const toLabel = CATEGORIES[state.category].units.find(([id]) => id === state.to)[1];
      const fromLabel = CATEGORIES[state.category].units.find(([id]) => id === state.from)[1];
      resultUnit.textContent = toLabel.match(/\(([^)]+)\)/)?.[1] || toLabel;
      formulaNote.textContent = `${value} ${fromLabel.match(/\(([^)]+)\)/)?.[1] || ''} = ${fmt(converted)} ${resultUnit.textContent}`;
    }

    categoryRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.opt-chip');
      if (!btn) return;
      state.category = btn.dataset.cat;
      renderCategories();
      fillSelects();
      compute();
    });

    document.getElementById('swapBtn').addEventListener('click', () => {
      const a = fromUnit.value;
      fromUnit.value = toUnit.value;
      toUnit.value = a;
      compute();
    });

    valueInput.addEventListener('input', compute);
    fromUnit.addEventListener('change', compute);
    toUnit.addEventListener('change', compute);

    renderCategories();
    fillSelects();
    compute();
  </script>
