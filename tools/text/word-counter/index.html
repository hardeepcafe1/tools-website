        All tools
      </a>
      <a class="brand" href="../../../index.html" aria-label="Toolbox home">
        <svg class="brand-mark" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <defs><linearGradient id="brandGradSm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
          <rect width="32" height="32" rx="8" fill="url(#brandGradSm)"/>
          <rect x="8.5" y="8.5" width="6.5" height="6.5" rx="1.6" fill="#fff"/>
          <rect x="17" y="8.5" width="6.5" height="6.5" rx="1.6" fill="#fff" opacity=".75"/>
          <rect x="8.5" y="17" width="6.5" height="6.5" rx="1.6" fill="#fff" opacity=".75"/>
          <rect x="17" y="17" width="6.5" height="6.5" rx="1.6" fill="#fff" opacity=".5"/>
        </svg>
        <span class="brand-name" style="font-size:17px">Toolbox</span>
      </a>
    </div>
  </header>

  <main class="tool-shell">
    <!-- Head -->
    <div class="tool-head">
      <div class="tool-icon tint-text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="6.5" x2="20" y2="6.5"/><line x1="4" y1="12" x2="15" y2="12"/><line x1="4" y1="17.5" x2="17.5" y2="17.5"/></svg>
      </div>
      <h1>Word Counter</h1>
      <p>Type or paste your text below. Everything is counted live — and nothing ever leaves your browser.</p>
    </div>

    <!-- Panel -->
    <div class="tool-panel">
      <textarea id="wcInput" class="tool-textarea" placeholder="Start typing, or paste your text here…" autofocus spellcheck="true" aria-label="Text to count"></textarea>

      <div class="stat-tiles" aria-live="polite">
        <div class="stat-tile"><strong id="stWords">0</strong><span>Words</span></div>
        <div class="stat-tile"><strong id="stChars">0</strong><span>Characters</span></div>
        <div class="stat-tile"><strong id="stCharsNoSpace">0</strong><span>No spaces</span></div>
        <div class="stat-tile"><strong id="stSentences">0</strong><span>Sentences</span></div>
        <div class="stat-tile"><strong id="stParagraphs">0</strong><span>Paragraphs</span></div>
        <div class="stat-tile"><strong id="stReadTime">0m 0s</strong><span>Reading time</span></div>
      </div>

      <div class="tool-actions">
        <button class="btn btn-primary" id="copyStatsBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          Copy stats
        </button>
        <button class="btn btn-ghost" id="clearBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Clear text
        </button>
      </div>
    </div>
  </main>

  <a class="harmno-badge" href="https://github.com/harmno" target="_blank" rel="noopener" aria-label="Harmno on GitHub"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.111.82-.261.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg>Harmno</a>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <footer class="tool-footer-mini">
    <a href="../../../index.html">← Back to all tools</a> &nbsp;·&nbsp; Toolbox by <a href="https://github.com/harmno" target="_blank" rel="noopener">Harmno</a>
  </footer>

  <script>
    const input       = document.getElementById('wcInput');
    const stWords     = document.getElementById('stWords');
    const stChars     = document.getElementById('stChars');
    const stNoSpace   = document.getElementById('stCharsNoSpace');
    const stSentences = document.getElementById('stSentences');
    const stParas     = document.getElementById('stParagraphs');
    const stReadTime  = document.getElementById('stReadTime');
    const toast       = document.getElementById('toast');

    const fmt = (n) => n.toLocaleString();

    function analyse(text) {
      const trimmed = text.trim();
      const words = trimmed ? trimmed.split(/\s+/).filter(Boolean) : [];
      const sentences = trimmed ? (trimmed.match(/[^.!?…]+[.!?…]+["')\]]?|[^.!?…]+$/g) || []).filter(s => s.trim().length > 0) : [];
      const paragraphs = trimmed ? trimmed.split(/\n\s*\n/).filter(p => p.trim().length > 0) : [];

      // Average adult reading speed ≈ 220 wpm
      const minutesFloat = words.length / 220;
      const mins = Math.floor(minutesFloat);
      const secs = Math.round((minutesFloat - mins) * 60);

      return {
        words: words.length,
        chars: text.length,
        noSpace: text.replace(/\s/g, '').length,
        sentences: sentences.length,
        paragraphs: paragraphs.length,
        readTime: words.length === 0 ? '0m 0s' : `${mins}m ${secs}s`,
      };
    }

    function render() {
      const a = analyse(input.value);
      stWords.textContent     = fmt(a.words);
      stChars.textContent     = fmt(a.chars);
      stNoSpace.textContent   = fmt(a.noSpace);
      stSentences.textContent = fmt(a.sentences);
      stParas.textContent     = fmt(a.paragraphs);
      stReadTime.textContent  = a.readTime;
    }

    let toastTimer;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    input.addEventListener('input', render);

    document.getElementById('clearBtn').addEventListener('click', () => {
      input.value = '';
      render();
      input.focus();
    });

    document.getElementById('copyStatsBtn').addEventListener('click', async () => {
      const a = analyse(input.value);
      const text = [
        'Word Counter — stats',
        `Words: ${a.words}`,
        `Characters: ${a.chars}`,
        `Characters (no spaces): ${a.noSpace}`,
        `Sentences: ${a.sentences}`,
        `Paragraphs: ${a.paragraphs}`,
        `Reading time: ${a.readTime}`,
      ].join('\n');
      try {
        await navigator.clipboard.writeText(text);
        showToast('Stats copied to clipboard');
      } catch {
        showToast('Clipboard blocked — select and copy manually');
      }
    });

    render();
  </script>
  <script src="../../../js/vault.js"></script>
</body>
</html>
